version: 2

updates:
  # Python dependencies. The uv ecosystem reads pyproject.toml and updates uv.lock,
  # which is what CI installs from.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Prague
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    # One PR for the routine bumps, so auto-merge does not produce five a week. Majors
    # are deliberately left ungrouped, so each arrives on its own and gets read.
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Prague
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
