[project]
name = "ftb-mcp"
version = "0.1.0"
description = "MCP server exposing MyHeritage Family Tree Builder (.ftb) and GEDCOM genealogy data"
requires-python = ">=3.11"
dependencies = [
    "ged4py>=0.5",
    "mcp>=2.0.0",
    "uvicorn>=0.30",
]

[project.scripts]
ftb-mcp = "ftb_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ftb_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Hex literals captured verbatim from kafkova.ftb; wrapping them would obscure the
# byte sequences they pin behaviour against.
"tests/test_decode.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
