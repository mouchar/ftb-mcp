[project]
name = "ftb-mcp"
version = "0.1.0"
description = "MCP server exposing MyHeritage Family Tree Builder (.ftb) and GEDCOM genealogy data"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Robert Moucha" }]
keywords = ["mcp", "genealogy", "gedcom", "family-tree-builder", "myheritage", "sqlite"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Sociology :: Genealogy",
    "Typing :: Typed",
]
dependencies = [
    "ged4py>=0.5",
    "mcp>=2.0.0",
    "uvicorn>=0.52.3",
]

[project.urls]
Homepage = "https://github.com/mouchar/ftb-mcp"
Repository = "https://github.com/mouchar/ftb-mcp"
Issues = "https://github.com/mouchar/ftb-mcp/issues"

[project.scripts]
ftb-mcp = "ftb_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ftb_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Hex literals captured verbatim from kafkova.ftb; wrapping them would obscure the
# byte sequences they pin behaviour against.
"tests/test_decode.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
